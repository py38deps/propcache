---

name: CI

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


env:
  COLOR: yes
  FORCE_COLOR: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  PIP_NO_PYTHON_VERSION_WARNING: 1
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: 1


jobs:

  tests:
    name: tests / ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
        - python: '3.8'
        - python: '3.9'
        - python: '3.10'
        - python: '3.11'
        - python: '3.12'
        - python: '3.13'
        - python: '3.13t'
        - python: '3.14'
        - python: '3.14t'
        - python: '3.15'
        - python: '3.15t'
        - python: 'pypy-3.10'
          no_extensions: true
    steps:
    - name: Check out the source tree
      uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v7
      with:
        allow-prereleases: true
        python-version: ${{ matrix.python }}
    - name: Install test dependencies
      run: >-
        python -m pip install
        --upgrade
        -r requirements/test.txt
    - name: Build and install propcache
      run: >-
        python -m pip install
        --no-build-isolation
        --force-reinstall
        .
    - name: Run the test suite against the C extension
      if: ${{ !matrix.no_extensions }}
      run: python -m pytest
    - name: Run the test suite against the pure Python implementation
      run: python -m pytest --no-c-extensions

  sdist:
    name: sdist + pure Python wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check out the source tree
      uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install build
      run: python -m pip install build
    - name: Build the sdist and the pure Python wheel
      run: >-
        python -m build
        --outdir dist
        --config-setting=pure-python=true
        .
    - name: Validate the metadata
      run: |
        python -m pip install "twine>=6.2,<7"
        python -m twine check --strict dist/*
    - name: Upload the sdist and the pure Python wheel
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/*
        if-no-files-found: error

  wheels:
    name: wheels / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: manylinux2014 + musllinux_1_2 x86_64
          os: ubuntu-latest
          archs: x86_64
          manylinux_image: quay.io/pypa/manylinux2014_x86_64:2026.05.02-2
          musllinux_image: quay.io/pypa/musllinux_1_2_x86_64:2026.05.02-2
          artifact: wheel-linux-x86_64
        - name: manylinux2014 + musllinux_1_2 i686
          os: ubuntu-latest
          archs: i686
          manylinux_image: quay.io/pypa/manylinux2014_i686:2026.05.02-2
          musllinux_image: quay.io/pypa/musllinux_1_2_i686:2026.05.02-2
          artifact: wheel-linux-i686
        - name: manylinux2014 + musllinux_1_2 aarch64
          os: ubuntu-24.04-arm
          archs: aarch64
          manylinux_image: quay.io/pypa/manylinux2014_aarch64:2026.05.02-2
          musllinux_image: quay.io/pypa/musllinux_1_2_aarch64:2026.05.02-2
          artifact: wheel-linux-aarch64
        - name: manylinux2014 + musllinux_1_2 ppc64le
          os: ubuntu-latest
          archs: ppc64le
          qemu: ppc64le
          manylinux_image: quay.io/pypa/manylinux2014_ppc64le:2026.05.02-2
          musllinux_image: quay.io/pypa/musllinux_1_2_ppc64le:2026.05.02-2
          artifact: wheel-linux-ppc64le
        - name: manylinux2014 + musllinux_1_2 s390x
          os: ubuntu-latest
          archs: s390x
          qemu: s390x
          manylinux_image: quay.io/pypa/manylinux2014_s390x:2026.05.02-2
          musllinux_image: quay.io/pypa/musllinux_1_2_s390x:2026.05.02-2
          artifact: wheel-linux-s390x
        - name: manylinux_2_39 + musllinux_1_2 riscv64
          os: ubuntu-latest
          archs: riscv64
          qemu: riscv64
          manylinux_image: quay.io/pypa/manylinux_2_39_riscv64:2026.05.02-2
          musllinux_image: quay.io/pypa/musllinux_1_2_riscv64:2026.05.02-2
          # Upstream starts at 3.10 for this architecture.
          skip: 'cp38-* cp39-*'
          artifact: wheel-linux-riscv64
        - name: musllinux_1_2 armv7l
          os: ubuntu-24.04-arm
          archs: armv7l
          qemu: arm
          musllinux_image: quay.io/pypa/musllinux_1_2_armv7l:2026.05.02-2
          skip: '*-manylinux_*'
          artifact: wheel-linux-armv7l
        # Build x86_64 and arm64 separately: pip picks the native wheel and
        # each runner tests the architecture it built.
        - name: macOS x86_64
          os: macos-15-intel
          archs: x86_64
          artifact: wheel-macos-x86_64
        - name: macOS arm64
          os: macos-15
          archs: arm64
          install_native_py38: true
          artifact: wheel-macos-arm64
        - name: Windows amd64
          os: windows-2022
          archs: AMD64
          artifact: wheel-windows-amd64
        - name: Windows win32
          os: windows-2022
          archs: x86
          artifact: wheel-windows-win32
        - name: Windows arm64
          os: windows-11-arm
          archs: ARM64
          # CPython 3.8 has no arm64 installer; cibuildwheel can install the
          # experimental 3.9 arm64 build, so start there.
          skip: 'cp38-*'
          artifact: wheel-windows-arm64
    env:
      CIBW_ARCHS: ${{ matrix.archs }}
      CIBW_BUILD: >-
        cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp313t-* cp314-* cp314t-*
      # The containers do not ship uv, and pip is available everywhere.
      CIBW_BUILD_FRONTEND: build
      CIBW_SKIP: ${{ matrix.skip }}
      CIBW_TEST_COMMAND: python -m pytest -v --no-cov {project}/tests
    steps:
    - name: Check out the source tree
      uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Set up QEMU
      if: matrix.qemu
      uses: docker/setup-qemu-action@v3
      with:
        platforms: ${{ matrix.qemu }}
    # cibuildwheel's CPython 3.8 installer is x86_64-only, so install the
    # native arm64 universal2 build from python.org before building wheels.
    - name: Install native arm64 CPython 3.8
      if: matrix.install_native_py38
      run: |
        curl -fsSL -o /tmp/Python38.pkg https://www.python.org/ftp/python/3.8.10/python-3.8.10-macos11.pkg
        sudo installer -pkg /tmp/Python38.pkg -target /
        sh "/Applications/Python 3.8/Install Certificates.command"
        /Library/Frameworks/Python.framework/Versions/3.8/bin/python3 -c 'import platform; print(platform.machine()); assert platform.machine() == "arm64"'
    - name: Build cp38-cp314t wheels
      env:
        CIBW_ENABLE: cpython-freethreading
        # Only one arch is built per job, so the image for that arch is the
        # only one cibuildwheel reads; the rest are ignored.
        CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_image }}
        CIBW_MANYLINUX_I686_IMAGE: ${{ matrix.manylinux_image }}
        CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.manylinux_image }}
        CIBW_MANYLINUX_PPC64LE_IMAGE: ${{ matrix.manylinux_image }}
        CIBW_MANYLINUX_S390X_IMAGE: ${{ matrix.manylinux_image }}
        CIBW_MANYLINUX_RISCV64_IMAGE: ${{ matrix.manylinux_image }}
        CIBW_MUSLLINUX_X86_64_IMAGE: ${{ matrix.musllinux_image }}
        CIBW_MUSLLINUX_I686_IMAGE: ${{ matrix.musllinux_image }}
        CIBW_MUSLLINUX_AARCH64_IMAGE: ${{ matrix.musllinux_image }}
        CIBW_MUSLLINUX_PPC64LE_IMAGE: ${{ matrix.musllinux_image }}
        CIBW_MUSLLINUX_S390X_IMAGE: ${{ matrix.musllinux_image }}
        CIBW_MUSLLINUX_ARMV7L_IMAGE: ${{ matrix.musllinux_image }}
        CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ matrix.musllinux_image }}
      run: |
        python -m pip install "cibuildwheel==3.4.1"
        python -m cibuildwheel --output-dir wheelhouse .
    # cibuildwheel 4.x dropped CPython 3.8, so cp315/cp315t need a second
    # pass. It always builds free-threaded wheels (the v3 enable group is
    # not accepted), and its 2026.09 images are the first ones with 3.15.
    - name: Build cp315 wheels
      env:
        CIBW_BUILD: cp315-* cp315t-*
      run: |
        python -m pip install "cibuildwheel==4.2.1"
        python -m cibuildwheel --output-dir wheelhouse .
    - name: Upload the wheels
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        path: ./wheelhouse/*.whl
        if-no-files-found: error

  merge-wheels:
    name: Merge wheel artifacts
    needs:
    - wheels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Merge the wheel artifacts
      uses: actions/upload-artifact/merge@v7
      with:
        name: wheels
        pattern: wheel-*
        delete-merged: true
